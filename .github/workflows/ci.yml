name: AgroShield AI - Production CI Pipeline

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite with Coverage
        run: |
          python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=60 tests/

      - name: Verify Model Artifact Integrity
        run: |
          python -c "import joblib, json; joblib.load('src/models/artifacts/spoilage_model.joblib'); metrics=json.load(open('src/models/artifacts/model_metrics.json')); print('Model integrity OK. Accuracy:', metrics['accuracy_pct'])"

      - name: Validate Health & Advisory Endpoints
        run: |
          python -m unittest tests/test_api_runner.py -v
          python -m unittest tests/test_weather_and_advisory.py -v
