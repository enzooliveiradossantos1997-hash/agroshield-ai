name: AgroShield AI - CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Run Automated Test Suite (Unittest)
        run: |
          python -m unittest tests/test_api_runner.py -v

      - name: Verify Model Artifact Integrity
        run: |
          python -c "import joblib, json; joblib.load('src/models/artifacts/spoilage_model.joblib'); metrics=json.load(open('src/models/artifacts/model_metrics.json')); print('Model loaded successfully. Accuracy:', metrics['accuracy_pct'])"
